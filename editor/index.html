<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Work Hub · Studio</title><link rel="stylesheet" href="/style.css"><header><b>WORK HUB <small>STUDIO</small></b><select id="projects" aria-label="Project"></select><button id="new">＋ Project</button><button id="library">Thư viện</button><button id="workflow-open">Quy trình dựng</button><span class="spacer"></span><span id="status" role="status">Đang tải</span><button id="undo" aria-label="Hoàn tác">↶</button><button id="redo" aria-label="Làm lại">↷</button><button id="save">Lưu</button><button data-action="hyperframes">HyperFrames</button><button data-action="concat">ConCat</button><button data-action="render">Xuất video</button><button data-action="draft" hidden>Bản cắt thô</button><button data-action="delivery" class="accent" hidden>Bản ứng viên</button></header><main><aside id="left"><div class="panel-title">LAYERS <button id="add">＋</button></div><select id="kind" aria-label="Loại layer"><option>text</option><option>caption</option><option>shape</option><option>image</option><option>video</option><option>audio</option></select><div id="layers"></div><p id="workflow-state"></p><button data-action="handoff">Gói bàn giao</button><label>Bố cục mẫu<select id="template"></select></label><button id="apply-template">Xem bố cục mẫu</button><div class="panel-title">PROJECT</div><label>Tên<input id="title"></label><label>Khung hình<select id="aspect"><option value="landscape">16:9 · 1080p</option><option value="portrait">9:16 · 1080p</option></select></label><label>Màu nền<input id="background" type="color"></label><button id="narrate" data-action="narrate">Tạo WAV theo storyboard</button><button id="storyboard">Storyboard / whiteboard</button><button data-action="whiteboard">Render whiteboard</button><button id="srt">Nhập SRT / VTT</button><p id="caption-message" role="status"></p><button id="srtout">Xuất SRT</button></aside><section class="viewer"><div class="panel-title">PREVIEW <span id="size"></span></div><div id="viewport"><div id="canvas"><iframe id="frame" title="Composition preview" sandbox="allow-scripts allow-same-origin"></iframe><div id="handles"></div></div></div><div class="transport"><button id="play">▶</button><output id="time">0.00s</output><input id="seek" type="range" min="0" step="0.033333" value="0"><button id="trim-left">Trim đầu</button><button id="split">Tách clip</button><button id="trim-right">Trim đuôi</button><label>Zoom <input id="zoom" type="range" min="10" max="100" value="30"></label></div><div id="jobs"></div></section><aside id="inspector"><div class="panel-title">THUỘC TÍNH</div><div id="props">Chọn layer trên canvas hoặc timeline.</div></aside></main><footer><div class="panel-title">TIMELINE <small>Kéo clip · giữ Shift để trim mép phải · Space phát/dừng</small></div><div id="timeline"></div></footer><dialog id="catalog"><div class="panel-title">THƯ VIỆN WORK HUB <button id="close">Đóng</button></div><label>Tìm tư liệu<input id="search" placeholder="Ví dụ: sân đèn, riser…"></label>
<label>Nhóm<select id="library-kind"><option value="">Tất cả</option><option value="footage">Footage</option><option value="reference">Video mẫu</option><option value="sfx">SFX</option><option value="legacy">Tài nguyên cũ</option></select></label>
<button id="library-add">Thêm tư liệu</button> <output id="library-count"></output>
<p id="library-message" role="status"></p><form id="library-editor" hidden></form><div id="entries"></div></dialog>
<dialog id="workflow-panel"><div class="panel-title">QUY TRÌNH DỰNG <button id="workflow-close">Đóng</button></div>
<p id="workflow-message" role="status"></p><div id="workflow-body"></div></dialog><dialog id="template-dialog" aria-labelledby="template-title">
<div class="panel-title"><h2 id="template-title"></h2><button id="template-close">Đóng</button></div>
<div id="template-stage"><iframe id="template-frame" title="Xem trước bố cục mẫu" sandbox="allow-scripts allow-same-origin"></iframe></div>
<p id="template-message" role="status"></p>
<button id="template-insert">Chèn tại playhead</button>
<button id="template-new">Tạo project từ mẫu</button>
</dialog><script type="module" src="/app.js?v=9"></script></html>
